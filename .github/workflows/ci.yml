name: Go checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l $(find . -name '*.go'))"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./cmd/server
      - name: Container build
        run: docker build -t tksu-pl:ci .
      - name: Fresh database HTTP scenario in Docker
        run: |
          docker run -d --name tksu-pl-check -p 127.0.0.1:8080:8080 \
            -e HOST=0.0.0.0 -e PORT=8080 -e DATABASE_PATH=/data/expenses.db \
            -e PUBLIC_URL=http://127.0.0.1:8080 -e COOKIE_SECURE=false \
            -e TZ=Europe/Moscow -e SESSION_SECRET="$(openssl rand -hex 32)" tksu-pl:ci
          trap 'docker logs --tail 20 tksu-pl-check; docker rm -f tksu-pl-check' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/ping
          TZ=Europe/Moscow python3 scripts/smoke.py http://127.0.0.1:8080
